base_path: "."
preserve_hierarchy: false
commit_message: "Update translations (%language%)"
pull_request_title: "Update Translations [skip ci]"

files:
  - source: "/**/composeResources/values/strings.xml"
    translation: "/%original_path%-%two_letters_code%/%original_file_name%"
    skip_untranslated_strings: true
    languages_mapping:
      two_letters_code:
        "pt-BR": "pt-rBR"
        "zh-CN": "zh-rCN"
        "zh-TW": "zh-rTW"
        "en-GB": "en-rGB"
        "no": "nb"
        "kmr": "ku"
  - source: "/**/res/values/strings.xml"
    translation: "/%original_path%-%two_letters_code%/%original_file_name%"
    skip_untranslated_strings: true
    languages_mapping:
      two_letters_code:
        "pt-BR": "pt-rBR"
        "zh-CN": "zh-rCN"
        "zh-TW": "zh-rTW"
        "en-GB": "en-rGB"
        "no": "nb"
        "kmr": "ku"
