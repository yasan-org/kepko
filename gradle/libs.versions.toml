androidx-datastore = "1.3.0"
androidx-compose-ui-tooling = "1.12.1"
androidx-navigation3-runtime = "1.2.1"
androidx-navigation3-ui = "1.2.0"
androidx-startup = "1.2.0"
detekt = "2.0.0-alpha.6"
jetbrains-compose = "1.12.2"
jetbrains-compose-material3 = "1.9.0"
jetbrains-kover = "0.9.11"
jetbrains-dokka = "2.3.0"
jetbrains-kotlin = "2.4.21"
