# Material Symbols used by Kepko (https://fonts.google.com/icons).
# Run `./gradlew :resource:syncIcons` after editing; it downloads the drawables and regenerates
# Icons.kt and NamedIcon.kt. Unlisted ic_*.xml drawables are deleted.
# `./gradlew :resource:checkIcons` fails if the generated sources or the set of drawables are out
# of sync (offline); add `--download` to also compare the drawable contents.
#
# The name is the drawable (ic_<name>), the Icons property (camelCase) and the serialized
# NamedIcon id, so renaming an icon breaks previously serialized data.
#
# `defaults` apply to every icon; any of them can be overridden per icon.
#   style:  outlined | rounded | sharp
#   fill:   true | false
#   weight: 100 | 200 | 300 | 400 | 500 | 600 | 700
#   grade:  -25 | 0 | 200
#   size:   20 | 24 | 40 | 48 (optical size, also the drawable size in dp)
#
# An icon is either a symbol name (`add`), or a mapping when the Kepko name differs
# from the symbol name or a setting is overridden:
#   - name: chevron_down          # -> ic_chevron_down.xml, Icons.chevronDown, NamedIcon.CHEVRON_DOWN
#     symbol: keyboard_arrow_down # Material Symbols name (may start with a digit, e.g. 3d_rotation)
#     fill: false

defaults:
  style: rounded
  fill: true
  weight: 400
  grade: 0
  size: 24

icons:
