name: Regenerate Snapshots

on:
  workflow_dispatch:

jobs:

  regenerate-snapshots:
    name: Regenerate Snapshots
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Regenerate Snapshots
        run: ./gradlew :resource:cleanRecordSnapshots :component:cleanRecordSnapshots :persistence:cleanRecordSnapshots :sample:composeApp:cleanRecordSnapshots

      - name: Commit Snapshots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resource/src/jvmTest/snapshots/ component/src/jvmTest/snapshots/ persistence/src/jvmTest/snapshots/ sample/composeApp/assets/readme/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Regenerate snapshots"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger the Crowdin Screenshots workflow, so call it here.
  upload-crowdin-screenshots:
    name: Upload Crowdin Screenshots
    needs: regenerate-snapshots
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/crowdin-screenshots.yml
    with:
      ref: ${{ needs.regenerate-snapshots.outputs.sha }}
    secrets: inherit
