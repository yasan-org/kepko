name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      force:
        description: Release even if nothing changed since the last release
        type: boolean
        default: false
      dry-run:
        description: Only show the next version and its release notes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Releases made with the default token don't trigger the Publish workflow.
      - name: Create Bot Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Check out the current main, not the commit the run was queued at.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      - name: Release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BUMP: ${{ inputs.bump }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: ./scripts/release.sh
